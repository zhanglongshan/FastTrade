[project]
name = "backend"
version = "3.2.0"
description = "fasttrade后端工程"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno==3.2.0",
    "aiofiles==25.1.0",                         # 文件操作
    "alembic==1.20.1",                          # 数据库迁移
    "apscheduler==3.11.3",                      # 定时任务
    "bleach==6.4.0",                            # 过滤 HTML 标签
    "click==8.5.1",                             # 命令行参数解析
    "croniter==7.0.0",                          # cron 表达式校验
    "fastapi==0.163.1",                         # fastapi 框架
    "greenlet==3.5.6",                          # 协程核心依赖（SQLAlchemy 异步）
    "httpx==0.28.1",                            # HTTP 客户端
    "jinja2==3.1.6",                            # 模板引擎（代码生成 + 遗留模板）
    "loguru==0.8.0",                            # 日志
    "openpyxl==3.1.5",                          # Excel 文件处理
    "psutil==7.2.2",                            # 系统信息
    "py-ip2region==3.0.6",                      # IP 归属地离线查询（内置 xdb，无外网请求）
    "pydantic-settings>=2.16.3,<3",              # 配置设置
    "pyjwt==2.15.1",                            # OAuth2
    "python-multipart==0.0.34",                 # request.form() 对表单进行「解析」时安装
    "redis==8.1.0",                             # redis 异步操作数据库
    "rich==15.0.0",                             # 终端打印美化
    "sqlalchemy==2.1.9",                       # 数据库ORM
    "asyncpg==0.32.0",                          # PostgreSQL 异步驱动（本项目默认数据库）
    "psycopg[binary]==3.3.9",                   # PostgreSQL 同步驱动（自带 libpq）
    "sqlglot==30.32.0",                          # sql 解析（纯 Python，避免 Rust 扩展源码编译卡住）
    "tinycss2==1.5.1",                          # bleach CSS 清洗依赖
    "typer==0.29.1",                            # 命令行工具
    "ua-parser==1.0.2",                         # 解析 User-Agent 获取 OS/浏览器
    "uvicorn==0.54.0",                          # uvicorn web 框架
    "websockets>=17.4,<18.0",                   # websocket 通信
    "aiosqlite==0.22.1",                        # 内嵌知识库（app/modules/ai/chat）固定使用 sqlite，故列入核心
    "openai==3.52.0",
    "pydantic[email]>=2.14.3",
    "cryptography==50.0.2",                  # Fernet 对称加密（存储源密码加密）
    "paramiko==5.1.0",                       # SFTP 协议
    "boto3==1.44.4",                        # S3 协议
    "esdk-obs-python==3.26.6",               # 华为云 OBS 协议
    "alibabacloud-oss-v2==1.4.1",            # 阿里云 OSS 协议
    "cos-python-sdk-v5==1.9.45",
]

# PostgreSQL 驱动已列入核心依赖（本项目 .env.dev 默认使用 fast_trade/postgres）。
# 其他数据库的驱动按需安装：uv sync --extra mysql / --extra sqlite
# 需同时支持三种库时用：uv sync --extra all-db
[project.optional-dependencies]
mysql = [
    "aiomysql>=0.3.2",                       # 异步驱动（ASYNC_DB_URI）
    "pymysql==1.2.4",                        # 同步驱动（DB_URI）
]
postgres = [
    "asyncpg==0.32.0",                       # 异步驱动（ASYNC_DB_URI）
    "psycopg[binary]==3.3.9",                # 同步驱动（DB_URI，自带 libpq）
]
sqlite = [
    "aiosqlite==0.22.1",
]
# 一个进程同时支持三种库（体积最大，适合本地开发）
all-db = [
    "aiomysql>=0.3.2",
    "pymysql==1.2.4",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.9",
    "aiosqlite==0.22.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0,<3",   # 测试：内存 Redis，配合 TESTING
    "pytest==9.2.0",
    "pytest-asyncio>=1.5.0",  # 异步测试支持
    "pytest-cov>=7.1.0",
    "ruff==0.17.5",          # 代码检查/格式化
]

[tool.uv]
default-groups = ["dev"]     # 本地 uv sync 含 dev；生产 pip -r requirements.txt 不含 pytest/ruff/fakeredis

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
line-length = 200
indent-width = 4
preview = false
fix = true
show-fixes = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "FAST",
    "F",
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "B904",  # Within an `except` clause
    "B010",  # Do not call with a constant attribute value.
    "B009",  # Do not use getattr() with a constant attribute value.
    "E712",  # Avoid equality comparisons to `False`; use `not getattr(self.model, "is_deleted"):` for false checks
    "W293",  # blank line with whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 先设置 TESTING/SQLite 环境再 import 应用

[tool.ruff.format]
docstring-code-format = true
preview = false
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# FastAPI TestClient/anyio 在后台线程执行端点；不启用线程追踪会漏记 controller 行
concurrency = ["thread", "greenlet"]
# 已确认范围：仅 MinIO/S3 有真实服务；以下协议无服务、不在验收口径内
omit = [
    "app/modules/task/storage/core/ftp_ftps_adapter.py",
    "app/modules/task/storage/core/sftp_adapter.py",
    "app/modules/task/storage/core/obs_adapter.py",
    "app/modules/task/storage/core/oss_adapter.py",
    "app/modules/task/storage/core/cos_adapter.py",
    # 用户确认本轮不要求真实 SSH；保留服务层单测但不再计入覆盖率分母
    "app/modules/ops/ssh/*",
]

[tool.coverage.report]
skip_covered = true

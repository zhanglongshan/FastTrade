name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt --progress-spinner off

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bandit
        run: python -m pip install --quiet bandit
      # -lll 仅高危严重性，-ii 仅高置信度，降低噪音；排除测试数据目录
      - name: Run bandit
        run: bandit -q -r backend/app -lll -ii -x backend/app/alembic,backend/tests

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-batch
